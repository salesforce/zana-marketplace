name: Bug report
description: A marketplace listing is broken or wrong
labels: ["bug"]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin id or name of the listing
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
  - type: input
    id: version
    attributes:
      label: Zana version and OS
      description: Settings → About
